[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFont = "Literata:https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap"
baseRadius = "small"

[theme.light]
primaryColor = "#2a5db0"
backgroundColor = "#f4f5f2"
secondaryBackgroundColor = "#e8eae5"
textColor = "#1c1f22"
linkColor = "#2a5db0"
borderColor = "#d3d6cf"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#8db0ea"
backgroundColor = "#141619"
secondaryBackgroundColor = "#1f2226"
textColor = "#e9eae6"
linkColor = "#8db0ea"
borderColor = "#33373c"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
